esphome:
  name: esphome-web-cdf5a4

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: "ASUS_W"
  password: "whiteWOLF667djkr"
  fast_connect: true
  power_save_mode: NONE

# Включаем шину I2S звука для Supermini
i2s_audio:
  - id: i2s_input_bus
    i2s_bclk_pin: GPIO4    # MIC_SCK (контакт 4)
    i2s_lrclk_pin: GPIO5   # MIC_WS  (контакт 5)

# Настройка микрофона
microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: i2s_input_bus
    i2s_din_pin: GPIO6     # MIC_SD  (контакт 6)
    adc_type: external
    pdm: false
    bits_per_sample: 16bit
# Привязка встроенной кнопки BOOT с подтяжкой питания
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
    name: "Кнопка"
    on_press:
      - voice_assistant.start:

# Подключение к голосовому движку Home Assistant
voice_assistant:
  id: va
  microphone: board_microphone
  noise_suppression_level: 2
  auto_gain: 24dBFS            # ИСПРАВЛЕНО: добавлена точка для формата float (дробное число)
  volume_multiplier: 2.0

api:
logger:


