name: Compile ESPHome

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install esphome
          esphome version

      - name: Compile YAML
        run: |
          # Компилируем вручную без всяких сторонних плагинов
          esphome compile bt.yaml

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-binary
          # Путь куда ESPHome складывает бинарник по умолчанию
          path: .esphome/build/esp32-c3-bt-proxy/.pioenvs/*/firmware.bin
