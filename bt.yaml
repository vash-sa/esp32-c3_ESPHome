esphome:
  name: esp32-c3-bt-proxy
  platformio_options:
    board_build.flash_mode: dio
  includes:
    - lora_handler.h
  on_boot:
    priority: 800  # <--- СТАВЬ ЭТО!
    then:
      - lambda: |-
          auto *my_lora = new LoRaCustomComponent();
          App.register_component_(my_lora);
          ESP_LOGI("custom", "LoRa Component Registered at boot!");

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf # ОБЯЗАТЕЛЬНО для работы с driver/spi_master.h

