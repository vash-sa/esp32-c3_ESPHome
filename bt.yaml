esphome:
  name: esp32-c3-bt-proxy
  # Специфичные опции для прошивки C3 через DIO
  platformio_options:
    board_build.flash_mode: dio
  includes:
    - lora_handler.h
  on_boot:
    priority: -10
    then:
      - lambda: |-
          static auto *my_lora = new LoRaCustomComponent();
          if (my_lora != nullptr) {
            App.register_component_(my_lora);
            my_lora->setup(); 
            ESP_LOGI("custom", "LoRa Driver injected and started!");
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  # ПЕРЕКЛЮЧАЕМ на arduino, так как lora_handler.h чаще всего написан под него
  framework:
    type: arduino

