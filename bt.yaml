esphome:
  name: esp32-c3-bt-proxy
  platformio_options:
    board_build.flash_mode: dio
  includes:
    - lora_handler.h

# Правильный способ регистрации кастомного кода
custom_component:
  - lambda: |-
      auto *my_lora = new LoRaCustomComponent();
      return {my_lora};

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: "ASUS_W"
  password: "whiteWOLF667djkr"
  power_save_mode: none

mqtt:
  broker: 192.168.1.64
  username: "sergey_vash"
  password: "vash_sa"
  # Оставляем false, так как ты шлешь Discovery вручную из C++
  discovery: false 

api:
ota:
  - platform: esphome

# Дает шанс прошиться, если код уйдет в бесконечный ребут
safe_mode:

logger:
  level: DEBUG
